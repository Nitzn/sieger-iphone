name: SIEGER iPhone – persönliches Installationspaket

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sieger-iphone
  cancel-in-progress: false

jobs:
  device-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Quellcode laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prüfen und ohne Apple-Zertifikate bauen
        run: bash scripts/build.sh
      - name: Installationspaket bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SIEGER-iPhone
          path: out/
          if-no-files-found: error
          retention-days: 1
